<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tournaments</title>

  <style>
    * {
  box-sizing: border-box;
}
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 50px;
    }

    h1 {
      margin: 0;
    }

    button {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      background: #007bff;
      color: white;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover {
      background: #0056b3;
    }

    .tournament-list {
      display: grid;
  grid-template-columns: repeat(3, 1fr); /* 3 cards per row */
  gap: 16px;
    }

    .card {
      background: white;
      padding: 16px;
      margin-top: 24px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    .empty {
      color: #777;
      margin-top: 20px;
    }

    /* MODAL */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      align-items: center;
      justify-content: center;
    }

    .modal {
      background: white;
      padding: 20px;
      border-radius: 8px;
      width: 420px;
    }

    .modal h2 {
      margin-top: 0;
      margin-bottom: 12px;
    }

    .modal input {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .cancel-btn {
      background: #6c757d;
    }

    .cancel-btn:hover {
      background: #5a6268;
    }
    .back-btn {
  height: 100%;
  padding: 0 24px;
  color: #111; 
  border: none;
  background: transparent;
  font-size: 18px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
}

.back-btn:hover {
  background: #f1f5f9;
}
 .top-bar {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 60px;
  background: #ffffff;
  z-index: 1200;
  display: flex;
  align-items: center;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}
.arrow {
  width: 10px;
  height: 10px;
  border-left: 3px solid #111;
  border-bottom: 3px solid #111;
  transform: rotate(45deg);
}
  </style>
</head>
<body>
 <div class="top-bar">
  <button id="backBtn" class="back-btn" onclick="goBack()">
    <span class="arrow"></span>
  Back
  </button>
</div>
  <div class="header">
    <h1>Tournaments</h1>
    <button id="createBtn">+ Create Tournament</button>
  </div>

  <div id="tournamentList" class="tournament-list"></div>

  <!-- MODAL -->
  <div id="modalOverlay" class="modal-overlay">
    <div class="modal">
      <h2>Create Tournament</h2>
      <input type="text" id="name" placeholder="Tournament Name" />
      <input type="text" id="location" placeholder="Location" />
      <input type="text" id="category" placeholder="Category" />

      <div class="modal-actions">
        <button class="cancel-btn" id="cancelBtn">Cancel</button>
        <button id="saveBtn">Save</button>
      </div>
    </div>
  </div>

  <script src="config.js"></script>

  <script>
    const tournamentList = document.getElementById("tournamentList");
    const createBtn = document.getElementById("createBtn");
    const modalOverlay = document.getElementById("modalOverlay");
    const cancelBtn = document.getElementById("cancelBtn");
    const saveBtn = document.getElementById("saveBtn");

    createBtn.addEventListener("click", () => {
      modalOverlay.style.display = "flex";
    });

    cancelBtn.addEventListener("click", closeModal);

    modalOverlay.addEventListener("click", (e) => {
      if (e.target === modalOverlay) closeModal();
    });

    function closeModal() {
      modalOverlay.style.display = "none";
      document.getElementById("name").value = "";
      document.getElementById("location").value = "";
      document.getElementById("category").value = "";
    }

    async function loadTournaments() {
      try {
        const res = await fetch(`${API_BASE_URL}/tournaments`, {
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${localStorage.getItem("token") || ""}`
          }
        });

        const data = await res.json();

        if (!data.length) {
          tournamentList.innerHTML =
            `<p class="empty">No tournaments available.</p>`;
          return;
        }

        tournamentList.innerHTML = data.map(t => `
          <div class="card" onclick='openTournament(${JSON.stringify(t)})'>
            <h3>${t.name}</h3>
            <p>Location: ${t.location || "N/A"}</p>
            <p>Category: ${t.category || "N/A"}</p>
          </div>
        `).join("");
      } catch {
        tournamentList.innerHTML =
          `<p class="empty">Failed to load tournaments</p>`;
      }
    }
    


    function openTournament(tournament) {
  localStorage.setItem("selectedTournament", JSON.stringify(tournament));
  window.location.href = "matches.html";
}

   function goBack() {
  window.location.href = 'index.html';
} 

    saveBtn.addEventListener("click", async () => {
      const name = document.getElementById("name").value;
      const location = document.getElementById("location").value;
      const category = document.getElementById("category").value;

      if (!name || !location || !category) {
        alert("All fields are required");
        return;
      }

      try {
        await fetch(`${API_BASE_URL}/tournaments`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${localStorage.getItem("token") || ""}`
          },
          body: JSON.stringify({ 
            "name" :name ,
            "location":location,
            "category":category


          })
        });

        closeModal();
        loadTournaments();
      } catch {
        alert("Failed to create tournament");
      }
    });

    loadTournaments();
  </script>

</body>
</html>
