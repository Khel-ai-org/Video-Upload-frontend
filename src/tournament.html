<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tournaments</title>

 <style>
* {
  box-sizing: border-box;
}

body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  background: #f5f7fa;
  margin: 0;
  padding: 20px;
  color: #1f2937;
}

/* TOP BAR */
.top-bar {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 60px;
  background: #ffffff;
  z-index: 1200;
  display: flex;
  align-items: center;
  border-bottom: 1px solid #e5e7eb;
}

.back-btn {
  height: 100%;
  padding: 0 20px;
  color: #111827;
  border: none;
  background: transparent;
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
}

.back-btn:hover {
  background: #f3f4f6;
}

.arrow {
  width: 9px;
  height: 9px;
  border-left: 2px solid #111;
  border-bottom: 2px solid #111;
  transform: rotate(45deg);
}

/* HEADER */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 60px;
  margin-bottom: 10px;
}

h1 {
  margin: 0;
  font-size: 24px;
  font-weight: 600;
}

/* BUTTON */
button {
  padding: 9px 14px;
  border: none;
  border-radius: 6px;
  background: #2563eb;
  color: white;
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
}

button:hover {
  background: #1d4ed8;
}

/* GRID */
.tournament-list {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}

/* CARD */
.card {
  background: #ffffff;
  padding: 14px 16px;
  margin-top: 20px;
  border-radius: 8px;
  border: 1px solid #e5e7eb;
}

.card h3 {
  margin: 0 0 6px;
  font-size: 16px;
  font-weight: 600;
}

.card p {
  margin: 3px 0;
  font-size: 13px;
  color: #4b5563;
}

/* EMPTY */
.empty {
  color: #6b7280;
  margin-top: 20px;
  font-size: 14px;
}

/* MODAL */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  display: none;
  align-items: center;
  justify-content: center;
}

.modal {
  background: white;
  padding: 20px;
  border-radius: 8px;
  width: 400px;
}

.modal h2 {
  margin-top: 0;
  margin-bottom: 14px;
  font-size: 18px;
  font-weight: 600;
}

.modal input {
  width: 100%;
  padding: 9px 10px;
  margin-bottom: 10px;
  border: 1px solid #d1d5db;
  border-radius: 6px;
  font-size: 14px;
}

.modal input:focus {
  outline: none;
  border-color: #2563eb;
}

/* MODAL ACTIONS */
.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
}

.cancel-btn {
  background: #9ca3af;
}

.cancel-btn:hover {
  background: #6b7280;
}
</style>

</head>
<body>
 <div class="top-bar">
  <button id="backBtn" class="back-btn" onclick="goBack()">
    <span class="arrow"></span>
  Back
  </button>
</div>
  <div class="header">
    <h1>Tournaments</h1>
    <button id="createBtn">+ Create Tournament</button>
  </div>

  <div id="tournamentList" class="tournament-list"></div>

  <!-- MODAL -->
  <div id="modalOverlay" class="modal-overlay">
    <div class="modal">
      <h2>Create Tournament</h2>
      <input type="text" id="name" placeholder="Tournament Name" />
      <input type="text" id="location" placeholder="Location" />
      <input type="text" id="category" placeholder="Category" />

      <div class="modal-actions">
        <button class="cancel-btn" id="cancelBtn">Cancel</button>
        <button id="saveBtn">Save</button>
      </div>
    </div>
  </div>

  <script src="config.js"></script>

  <script>
    const tournamentList = document.getElementById("tournamentList");
    const createBtn = document.getElementById("createBtn");
    const modalOverlay = document.getElementById("modalOverlay");
    const cancelBtn = document.getElementById("cancelBtn");
    const saveBtn = document.getElementById("saveBtn");

    createBtn.addEventListener("click", () => {
      modalOverlay.style.display = "flex";
    });

    cancelBtn.addEventListener("click", closeModal);

    modalOverlay.addEventListener("click", (e) => {
      if (e.target === modalOverlay) closeModal();
    });

    function closeModal() {
      modalOverlay.style.display = "none";
      document.getElementById("name").value = "";
      document.getElementById("location").value = "";
      document.getElementById("category").value = "";
    }

    async function loadTournaments() {
      try {
        const res = await fetch(`${API_BASE_URL}/tournaments`, {
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${localStorage.getItem("token") || ""}`
          }
        });

        const data = await res.json();

        if (!data.length) {
          tournamentList.innerHTML =
            `<p class="empty">No tournaments available.</p>`;
          return;
        }

        // tournamentList.innerHTML = data.map(t => `
        //   <div class="card" onclick='openTournament(${JSON.stringify(t)})'>
        //     <h3>${t.name}</h3>
        //     <p>Location: ${t.location || "N/A"}</p>
        //     <p>Category: ${t.category || "N/A"}</p>
        //   </div>
        // `).join("");

        tournamentList.innerHTML = data.map((t, index) => `
  <div class="card" data-index="${index}">
    <h3>${t.name}</h3>
    <p>Location: ${t.location || "N/A"}</p>
    <p>Category: ${t.category || "N/A"}</p>
  </div>
`).join("");

document.querySelectorAll(".card").forEach(card => {
  card.addEventListener("click", () => {
    const index = card.dataset.index;
    openTournament(data[index]);
  });
});

      } catch {
        tournamentList.innerHTML =
          `<p class="empty">Failed to load tournaments</p>`;
      }
    }
    


    function openTournament(tournament) {
  localStorage.setItem("selectedTournament", JSON.stringify(tournament));
  window.location.href = "matches.html";
}

   function goBack() {
  window.location.href = 'index.html';
} 

    saveBtn.addEventListener("click", async () => {
      const name = document.getElementById("name").value;
      const location = document.getElementById("location").value;
      const category = document.getElementById("category").value;

      if (!name || !location || !category) {
        alert("All fields are required");
        return;
      }

      try {
        await fetch(`${API_BASE_URL}/tournaments`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${localStorage.getItem("token") || ""}`
          },
          body: JSON.stringify({ 
            "name" :name ,
            "location":location,
            "category":category


          })
        });

        closeModal();
        loadTournaments();
      } catch {
        alert("Failed to create tournament");
      }
    });

    loadTournaments();
  </script>

</body>
</html>
