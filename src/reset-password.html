<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password | Khel.ai</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .auth-card { box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.08); border: 1px solid #E5E7EB; }
  </style>
</head>
<body class="bg-[#F8FAFC] min-h-screen flex items-center justify-center p-4">

  <div class="auth-card bg-white rounded-3xl p-8 w-full max-w-[400px]">
    <div class="flex flex-col items-center mb-8">
      <div class="w-16 h-16 bg-[#F1F5F9] rounded-full flex items-center justify-center mb-4">
        <img src="assets/Logo.png" alt="Khel Logo" class="rounded-full w-10 h-10" />
      </div>
      <h1 class="text-2xl font-bold text-gray-900 text-center">Create New Password</h1>
    </div>

    <!-- Password Input -->
    <div class="mb-6">
      <label class="block text-md font-semibold text-gray-800 mb-2">New Password</label>
      <div class="relative">
        <input type="password" id="newPassword" placeholder="Enter New Password" 
          class="w-full bg-[#F3F4F6] rounded-xl p-3 outline-none focus:ring-2 focus:ring-[#4F75C9] pr-12" />
        <button type="button" id="togglePassword" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400">
          <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
        </button>
      </div>
    </div>

    <!-- Validation Checklist -->
    <div id="checklist" class="space-y-3 mb-8 text-sm text-gray-400">
      <div id="rule-len" class="flex items-center gap-2"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg> A minimum of 8 characters</div>
      <div id="rule-case" class="flex items-center gap-2"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg> Lower and uppercase letters</div>
      <div id="rule-num" class="flex items-center gap-2"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg> At least 1 number</div>
      <div id="rule-sym" class="flex items-center gap-2"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg> At least 1 symbol</div>
    </div>

    <button id="resetBtn" disabled class="w-full bg-[#4F75C9] text-white py-3 rounded-2xl font-bold opacity-50 cursor-not-allowed">Reset Password</button>

    <p class="text-center mt-6 text-gray-400 text-xs">
      You agree to our <span class="text-gray-800 underline cursor-pointer">Terms of Use</span> and 
      <span class="text-gray-800 underline cursor-pointer">Privacy Policy</span> by continuing.
    </p>
  </div>

  <script src="config.js"></script>
  <script>
    const passwordInput = document.getElementById("newPassword");
    const resetBtn = document.getElementById("resetBtn");
    
    // Toggle Visibility
    document.getElementById("togglePassword").addEventListener("click", () => {
      passwordInput.type = passwordInput.type === "password" ? "text" : "password";
    });

    // Validation Logic
    passwordInput.addEventListener("input", (e) => {
      const val = e.target.value;
      const rules = {
        len: val.length >= 8,
        case: /[a-z]/.test(val) && /[A-Z]/.test(val),
        num: /\d/.test(val),
        sym: /[!@#$%^&*]/.test(val)
      };

      // Update UI Colors
      document.getElementById("rule-len").className = rules.len ? "flex items-center gap-2 text-green-600" : "flex items-center gap-2 text-gray-400";
      document.getElementById("rule-case").className = rules.case ? "flex items-center gap-2 text-green-600" : "flex items-center gap-2 text-gray-400";
      document.getElementById("rule-num").className = rules.num ? "flex items-center gap-2 text-green-600" : "flex items-center gap-2 text-gray-400";
      document.getElementById("rule-sym").className = rules.sym ? "flex items-center gap-2 text-green-600" : "flex items-center gap-2 text-gray-400";

      // Enable/Disable Button
      const isValid = Object.values(rules).every(Boolean);
      resetBtn.disabled = !isValid;
      resetBtn.className = isValid ? "w-full bg-[#4F75C9] text-white py-3 rounded-2xl font-bold" : "w-full bg-[#4F75C9] text-white py-3 rounded-2xl font-bold opacity-50 cursor-not-allowed";
    });

    // Submit Logic
    resetBtn.addEventListener("click", async () => {
      const email = localStorage.getItem("resetEmail");
      const otp = localStorage.getItem("verifiedOtp");
      const newPassword = passwordInput.value;
      
      const res = await fetch(`${API_BASE_URL}/auth/reset-password`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email,  newPassword })
      });

      if (res.ok) {
        alert("Password reset successfully!");
        localStorage.removeItem("resetEmail");
        localStorage.removeItem("verifiedOtp");
        window.location.href = "index.html";
      } else alert("Reset failed");
    });
  </script>
</body>
</html>
