 <script>
  const formTitle = document.getElementById('formTitle');
  const authForm = document.getElementById('authForm');
  const nameInput = document.getElementById('name');
  const submitBtn = document.getElementById('submitBtn');
  const switchText = document.getElementById('switchText');
  const switchLink = document.getElementById('switchLink');

  let mode = "login"; // login | register

  function switchMode() {
    if (mode === "login") {
      mode = "register";
      formTitle.textContent = "Register";
      submitBtn.textContent = "Register";
      nameInput.style.display = "block";
      nameInput.required = true;
      switchText.innerHTML = `Already have an account? <span id="switchLink">Login</span>`;
    } else {
      mode = "login";
      formTitle.textContent = "Login";
      submitBtn.textContent = "Login";
      nameInput.style.display = "none";
      nameInput.required = false;
      switchText.innerHTML = `Don’t have an account? <span id="switchLink">Register</span>`;
    }

    // reattach click after DOM update
    document.getElementById("switchLink").onclick = switchMode;
  }

  switchLink.onclick = switchMode;

  authForm.addEventListener("submit", async (e) => {
    e.preventDefault();

    if (mode === "register") {
      const res = await fetch(`${API_BASE_URL}/auth/register`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          name: nameInput.value,
          email: authForm.email.value,
          password: authForm.password.value
        })
      });

      const data = await res.json();
      alert("Registered successfully");
      switchMode(); // auto go to login
    }

    if (mode === "login") {
      const res = await fetch(`${API_BASE_URL}/auth/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          email: authForm.email.value,
          password: authForm.password.value
        })
      });

      const data = await res.json();
      if (data.token) {
        localStorage.setItem("token", data.token);
        window.location.href = "tournament.html";
      } else {
           alert("Invalid Credentials");
      }
    }
  });
</script>
