<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Matches</title>

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top:30px;
      /* margin-bottom: 0px; */
    }

    button {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      background: #007bff;
      color: white;
      cursor: pointer;
    }

    button:hover { background: #0056b3; }

    /* MATCH GRID */
    .match-list {
      display: grid;
  grid-template-columns: repeat(3, 1fr);  /* 3 cards per row */
  gap: 16px;
    }

    .card {
      background: white;
      padding: 18px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    .card h3 {
      margin-top: 0;
      margin-bottom: 8px;
    }

    .card p {
      margin: 4px 0;
      color: #444;
      font-size: 14px;
    }

    .vs {
      font-weight: bold;
      color: #007bff;
    }

    .empty {
      color: #777;
    }

    /* MODAL */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      align-items: center;
      justify-content: center;
    }

    .modal {
      background: white;
      padding: 24px;
      border-radius: 12px;
      width: 440px;
      max-width: 92%;
    }
    .modal select {
  width: 100%;
  padding: 12px;
  margin-bottom: 12px;
  border: 1px solid #ccc;
  border-radius: 6px;
  font-size: 14px;
  background: white;
  cursor: pointer;
}

    .modal input {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .cancel-btn {
      background: #6c757d;
    }
    .back-btn {
  height: 100%;
  padding: 0 24px;
  border: none;
  color: #111; 
  background: transparent;
  font-size: 18px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
}

.back-btn:hover {
  background: #f1f5f9;
}
 .top-bar {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 60px;
  background: #ffffff;
  z-index: 1200;
  display: flex;
  align-items: center;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}
.arrow {
  width: 10px;
  height: 10px;
  border-left: 3px solid #111;
  border-bottom: 3px solid #111;
  transform: rotate(45deg);
}
  </style>
</head>
<body>
    <div class="top-bar">
  <button id="backBtn" class="back-btn" onclick="goBack()">
    <span class="arrow"></span>
  Back
  </button>
</div>
  <div class="header">
    <h1>Matches</h1>
    <button id="createBtn">+ Create Match</button>
  </div>

  <div id="matchList" class="match-list"></div>

  <!-- CREATE MATCH MODAL -->
  <div id="modalOverlay" class="modal-overlay">
    <div class="modal">
      <h2>Create Match</h2>

      <input id="teamA" placeholder="Team A" />
      <input id="teamB" placeholder="Team B" />
     
      <input id="matchDate" type="date" />
       <select id="innings" required>
  <option value="" disabled selected>Select Inning</option>
  <option value="First">First</option>
  <option value="Second">Second</option>
</select>

      <div class="modal-actions">
        <button class="cancel-btn" id="cancelBtn">Cancel</button>
        <button id="saveBtn">Save</button>
      </div>
    </div>
  </div>

  <script src="config.js"></script>

  <script>
    const matchList = document.getElementById("matchList");
    const modal = document.getElementById("modalOverlay");

    document.getElementById("createBtn").onclick = () => modal.style.display = "flex";
    document.getElementById("cancelBtn").onclick = closeModal;

    modal.onclick = e => {
      if (e.target === modal) closeModal();
    };

    function closeModal() {
      modal.style.display = "none";
      ["teamA","teamB","matchDate" , "innings"]
        .forEach(id => document.getElementById(id).value = "");
    }

    function openMatch(match) {
  localStorage.setItem("selectedMatch", JSON.stringify(match));
  window.location.href = "dashboard.html";  // or your desired details page
}
function goBack() {
  window.location.href = 'tournament.html';
} 

    async function loadMatches() {
      try {
        const detail =  JSON.parse(localStorage.getItem("selectedTournament"));
        console.log(detail);
        console.log(localStorage.getItem("token"));
        const res = await fetch(`${API_BASE_URL}/matches/tournament/${detail.id}`, {
          headers: {
            "Authorization": `Bearer ${localStorage.getItem("token") || ""}`
          }
        });

        const data = await res.json();

        if (!data.length) {
          matchList.innerHTML = `<p class="empty">No matches available.</p>`;
          return;
        }

        matchList.innerHTML = data.map(m => `
          <div class="card" onclick='openMatch(${JSON.stringify(m)})'>
            <h3>
              ${m.name}
            </h3>
            <p><b>Date:</b> ${m.date || "N/A"}</p>
           
          </div>
        `).join("");

      } catch {
        matchList.innerHTML = `<p class="empty">Failed to load matches</p>`;
      }
    }

    document.getElementById("saveBtn").onclick = async () => {
      const payload = {
        teamA: teamA.value,
        teamB: teamB.value,
        
        matchDate: matchDate.value,
       innings:innings.value
      };

    //   if (Object.values(payload).some(v => !v)) {
    //     alert("All fields are required");
    //     return;
    //   }

      await fetch(`${API_BASE_URL}/matches`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${localStorage.getItem("token") || ""}`
        },
        body: JSON.stringify({
            "name": `${teamA.value} vs ${teamB.value}`,
            "inings": innings.value === 'first' ? '1' : innings.value === 'second' ? '2' : null ,
            "date" : matchDate.value,
            "tournament_id": JSON.parse(localStorage.getItem("selectedTournament")).id

        })
      });

      closeModal();
      loadMatches();
    };

    loadMatches();
  </script>

</body>
</html>
