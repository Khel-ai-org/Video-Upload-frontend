<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Matches</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Roboto+Condensed:wght@600&display=swap" rel="stylesheet">

<style>
/* Styles remain exactly as you provided */
* { box-sizing: border-box; }
body { margin: 0; padding: 0; font-family: "Plus Jakarta Sans", sans-serif; background: #ffffff; }
.top-bar { display:flex; flex-direction: row; width: 100%; background: #ffffff; padding: 35px 40px; align-items: center; }
.header { display: flex; justify-content: space-between; align-items: center; margin-top: 40px; margin-bottom: 20px; padding: 0px 40px; }
.tournament { color: #1F2022; font-size: 24px; font-weight: 600; }
.create-btn { display: flex; align-items: center; gap: 8px; color: #fff; border: none; border-radius: 10px; height: 42px; padding: 0 20px; font-size: 16px; font-weight: 600; cursor: pointer; background: #4B70C3; white-space: nowrap; }
.match-list { display: grid; padding : 0px 40px 40px 40px; grid-template-columns: repeat(4, 1fr); gap: 24px; }
.card { display: flex; flex-direction: column; gap: 12px; padding: 16px 20px; border-radius: 24px; border: 1px solid #E5F0FF; background: #FFF; cursor: pointer; transition: box-shadow 0.18s, transform 0.18s; }
.card:hover { box-shadow: 0 4px 18px rgba(75,112,195,0.13); transform: translateY(-2px); }
.match-div { display: flex; flex-direction: row; align-items: center; justify-content: space-around; gap: 8px; }
.date { display: flex; color: #83878D; font-size: 13px; font-weight: 500; justify-content: center; width: 100%; }
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: none; align-items: center; justify-content: center; z-index: 2000; }
.modal { background: #fff; border-radius: 16px; width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; padding: 30px; position: relative; }
.modal-close { position: absolute; top: 14px; right: 14px; width: 28px; height: 28px; border-radius: 50%; border: none; background: #f3f4f6; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.modal-heading { font-size: 24px; font-weight: 600; text-align: center; margin-bottom: 4px; }
.modal-subheading { font-size: 13px; color: #6b7280; text-align: center; margin-bottom: 24px; }
.modal-fields { display: flex; flex-direction: column; gap: 14px; margin-bottom: 24px; }
.modal-label { font-size: 14px; font-weight: 600; color: #1e1e1e; margin-bottom: 6px; display: block;}
.modal-input, .modal-select { width: 100%; height: 42px; padding: 0 14px; background: #f5f5f5; border: none; border-radius: 10px; font-size: 14px; outline: none; }
.error-text { color: #e63946; font-size: 11px; font-weight: 600; margin-top: 4px; display: none; }
.modal-submit { width: 100%; height: 48px; background: #4b70c3; color: #fff; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; }
.user-profile-container { display: flex; flex-direction: row; gap: 12px; align-items: center; position: relative; cursor: pointer; }
.dropdown { position: absolute; top: 55px; right: 0; background: white; border: 1px solid #E5F0FF; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); display: none; flex-direction: column; min-width: 160px; z-index: 3000; overflow: hidden; }
.dropdown.show { display: flex; }
.dropdown-item { padding: 12px 20px; font-size: 14px; color: #1F2022; cursor: pointer; transition: background 0.2s; }
.dropdown-item:hover { background: #f5f8ff; color: #4B70C3; }
.menu-toggle { transition: transform 0.3s ease; }
.top-header { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 20px; }
.left-header { display: flex; align-items: center; gap: 16px; flex: 1; }
.logo-box { display: flex; flex-direction: row; gap:5px; align-items:center; }
.logo { display: flex; align-items: center; gap: 16px; }
.search-container { display: flex; width: 100%; max-width: 600px; padding: 12px 16px; align-items: center; gap: 12px; border-radius: 12px; border: 1px solid #E5F0FF; background: #FFF; }
.name { color: #1F2022; font-size: 16px; font-weight: 600; }
.email { color: #83878D; font-size: 14px; font-weight: 400; }
.empty { color: #6b7280; font-size: 14px; text-align: center; grid-column: 1 / -1; margin-top: 40px;}
.link-hint { font-size: 11px; color: #4b70c3; font-weight: bold; margin-bottom: 4px; display: block; }

/* ─── NEW CUSTOM DROPDOWN ARCHITECTURE STYLES ─── */
.custom-select-box { position: relative; width: 100%; }
.custom-select-trigger { display: flex; align-items: center; justify-content: space-between; width: 100%; height: 42px; padding: 0 14px; background: #f5f5f5; border: none; border-radius: 10px; font-size: 14px; color: #1F2022; cursor: pointer; user-select: none; }
.custom-select-trigger.placeholder-text { color: #6b7280; }
.custom-select-options { position: absolute; top: 46px; left: 0; width: 100%; background: #ffffff; border: 1px solid #E5F0FF; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); display: none; flex-direction: column; max-height: 200px; overflow-y: auto; z-index: 2500; }
.custom-select-options.show-list { display: flex; }
.custom-option-item { padding: 10px 14px; font-size: 14px; color: #1F2022; cursor: pointer; transition: background 0.15s, color 0.15s; }
.custom-option-item:hover { background: #f5f8ff; color: #4B70C3; }
.custom-option-item.selected-active { background: #f5f8ff; color: #4B70C3; font-weight: 500; }
.select-chevron { transition: transform 0.2s ease; color: #83878D; }
.select-chevron.rotate { transform: rotate(180deg); }

/* Decorative Gray Ring Vector Bat Frame Layout */
.bat-avatar-frame { width: 68px; height: 68px; background: #f3f4f6; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px auto; }
.bat-avatar-frame img { width: 34px; height: 34px; object-contain: fill; opacity: 0.75; }

/* Add/Ensure this for error visibility */
.error-text {
  color: #e63946;
  font-size: 11px;
  font-weight: 600;
  margin-top: 4px;
  display: none; 
}
.modal-input.invalid, .custom-select-trigger.invalid {
  border: 1px solid #e63946 !important;
}
</style>
</head>
<body>

<div class="top-bar">
  <div class="top-header">
    <div class="left-header">
      <div class="logo-box">
        <img onclick="goBack()" style='width: 40px; height: 40px; cursor: pointer;' src="./assets/back-arrow.svg"/>
        <div class="logo">
          <img src="./assets/Logo.png" height="30"/>
          <span style="font-size:22px; font-weight:700; font-family: Roboto Condensed;">
            <span style="color: #022775;">Khel.</span><span style="color: #00CDFF;">ai</span>
          </span>
        </div>
      </div>
      <div class="search-container">
        <img src="./assets/search-icon.svg"/>
        <input type="text" id="searchInput" placeholder="Type to search...match" style="border: none; outline: none; flex: 1; font-size: 14px; color: #1F2022;"/>
      </div>
    </div>

    <div class="user-profile-container" id="profileTrigger">
      <img src="./assets/default_image.jpeg" style="width: 40px; height: 40px; border-radius: 50%;" />
      <div style="display: flex; flex-direction: column;">
        <span class="name">User</span>
        <span class="email"></span>
      </div>
      <svg class="menu-toggle" xmlns="http://www.w3.org/2000/svg" width="12" height="8" viewBox="0 0 12 8" fill="none">
        <path d="M0.75 0.750019L5.75 6.75002L10.75 0.750019" stroke="#83878D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <div class="dropdown" id="userDropdown">
        <div class="dropdown-item logout">Logout</div>
      </div>
    </div>
  </div>
</div>

  <div class="header">
    <h1 class="tournament" id="tournamentTitle">Matches</h1>
     <button class="create-btn" id="createBtn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/>
        </svg>
        Create New Match
      </button>
  </div>

  <div id="matchList" class="match-list"></div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <button class="modal-close" id="cancelBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>

      <div class="bat-avatar-frame">
        <img src="./assets/cricket1.png" alt="bat icon" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'24\' height=\'24\' viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'%236b7280\' stroke-width=\'2\' stroke-linecap=\'round\' stroke-linejoin=\'round\'><line x1=\'18\' y1=\'2\' x2=\'22\' y2=\'6\'></line><path d=\'M7.5 10.5L16 2l6 6-8.5 8.5c-.8.8-1.9 1.3-3 1.3H7.5v-3.3c0-1.1.5-2.2 1.3-3z\'></path><path d=\'M7.5 17.5L2 23l1-2 2-1 5.5-5.5\'></path></svg>'"/>
      </div>

      <p class="modal-heading">Create New Match</p>
      <p class="modal-subheading">Enter the details below to Start new match</p>

      <div class="modal-fields">
        <div class="modal-field">
          <label class="modal-label">Link Scoring Match</label>
          <div class="custom-select-box" id="scoringSelectBox">
            <div class="custom-select-trigger placeholder-text" id="scoringSelectTrigger">
              <span id="scoringSelectText">Loading matches...</span>
              <svg class="select-chevron" width="10" height="6" viewBox="0 0 10 6" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M1 1L5 5L9 1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
            <div class="custom-select-options" id="scoringSelectOptions"></div>
          </div>
          <span class="error-text" id="error-scoring">Please select a scoring match</span>
        </div>

        <div class="modal-field">
          <label class="modal-label">Team A</label>
          <input class="modal-input" type="text" id="teamA" placeholder="Select a match" readonly />
          <span class="error-text" id="error-teamB">Team A is required</span>
        </div>
        <div class="modal-field">
          <label class="modal-label">Team B</label>
          <input class="modal-input" type="text" id="teamB" placeholder="Select a match" readonly />
          <span class="error-text" id="error-teamA">Team B is required</span>
        </div>
        
        <div class="modal-field">
          <label class="modal-label">Select Ground</label>
          <div class="custom-select-box" id="groundSelectBox">
            <div class="custom-select-trigger placeholder-text" id="groundSelectTrigger">
              <span id="groundSelectText">Select Ground</span>
              <svg class="select-chevron" width="10" height="6" viewBox="0 0 10 6" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M1 1L5 5L9 1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
            <div class="custom-select-options" id="groundSelectOptions"></div>
          </div>
          <span class="error-text" id="error-ground">Ground is required</span>
        </div>

        <div class="modal-field">
          <label class="modal-label">Date</label>
          <input class="modal-input" type="date" id="matchDate" />
          <!-- <p id="dateError" class="error-text">Date is outside tournament range.</p> -->
          <span class="error-text" id="error-matchDate">Date is required</span>
        </div>
        <!-- <div class="modal-field">
          <label class="modal-label">Inning</label>
          <select class="modal-select" id="innings">
            <option value="" disabled selected>Select Inning</option>
            <option value="1">First</option>
            <option value="2">Second</option>
          </select>
        </div> -->
      </div>
      
      <p id="generalError" style="color:#e63946; font-size:12px; text-align:center; margin-bottom:10px; display:none;">Please fill all fields.</p>
      <button class="modal-submit" id="saveBtn">Start a Match</button>
    </div>
  </div>

  <script src="config.js"></script>

  <script>
    
    const matchList = document.getElementById("matchList");
    const modal = document.getElementById("modalOverlay");
    const searchInput = document.getElementById("searchInput");
    const tournament = JSON.parse(localStorage.getItem("selectedTournament"));
    const toggle = document.querySelector(".menu-toggle");
    const dropdown = document.getElementById("userDropdown");

    // Dynamic state management trackers for handling structural state hooks values manually
    let selectedScoringMatchId = "";
    let selectedGroundId = "";

    // DOM UI Target Node Anchors references definitions
    const scoringTrigger = document.getElementById("scoringSelectTrigger");
    const scoringText = document.getElementById("scoringSelectText");
    const scoringOptionsContainer = document.getElementById("scoringSelectOptions");
    const scoringChevron = scoringTrigger.querySelector(".select-chevron");

    const groundTrigger = document.getElementById("groundSelectTrigger");
    const groundText = document.getElementById("groundSelectText");
    const groundOptionsContainer = document.getElementById("groundSelectOptions");
    const groundChevron = groundTrigger.querySelector(".select-chevron");

    let currentMatches = []; // Global variable to store fetched matches

    // Real-time Search Handler
    searchInput.oninput = (e) => {
        const query = e.target.value.toLowerCase().trim();
        const filtered = currentMatches.filter(m => {
            const teamNames = (m.name || "").toLowerCase();
            const venueName = (m.ground?.name || "").toLowerCase();
            const dateStr = m.date ? new Date(m.date).toLocaleDateString().toLowerCase() : "";
            
            return teamNames.includes(query) || 
                   venueName.includes(query) || 
                   dateStr.includes(query);
        });
        renderMatchList(filtered);
    };

    toggle.onclick = (e) => { e.stopPropagation(); dropdown.classList.toggle("show"); };
    
    // Toggle actions mapping workflows cleanly for Scoring Dropdown custom element block
    scoringTrigger.onclick = (e) => {
        e.stopPropagation();
        groundOptionsContainer.classList.remove("show-list");
        groundChevron.classList.remove("rotate");
        scoringOptionsContainer.classList.toggle("show-list");
        scoringChevron.classList.toggle("rotate");
    };

    // Toggle actions mapping workflows cleanly for Ground Dropdown custom element block
    groundTrigger.onclick = (e) => {
        e.stopPropagation();
        scoringOptionsContainer.classList.remove("show-list");
        scoringChevron.classList.remove("rotate");
        groundOptionsContainer.classList.toggle("show-list");
        groundChevron.classList.toggle("rotate");
    };

    // Generic Event dismissal loop hooks map tracking clicking actions out-of-frame boundaries safely
    window.onclick = (e) => { 
        if (!dropdown.contains(e.target) && !toggle.contains(e.target)) dropdown.classList.remove("show"); 
        
        if (!document.getElementById("scoringSelectBox").contains(e.target)) {
            scoringOptionsContainer.classList.remove("show-list");
            scoringChevron.classList.remove("rotate");
        }
        if (!document.getElementById("groundSelectBox").contains(e.target)) {
            groundOptionsContainer.classList.remove("show-list");
            groundChevron.classList.remove("rotate");
        }
    };
    
    document.querySelector(".logout").onclick = () => {
      localStorage.clear();
      window.location.href = "index.html";
    };

    document.getElementById("createBtn").onclick = () => {
        modal.style.display = "flex";
        loadGroundsForTournament();
        loadScoringMatches();
    };

    document.getElementById("cancelBtn").onclick = closeModal;
    modal.onclick = e => { if (e.target === modal) closeModal(); };

    function closeModal() {
      modal.style.display = "none";
      ["teamA","teamB","matchDate" , "innings"].forEach(id => {
          const el = document.getElementById(id);
          if(el) el.value = "";
      });

      // Clear the custom dropdown selectors text frames metrics back to stock settings parameters
      selectedScoringMatchId = "";
      scoringText.textContent = "Select Scoring Match";
      scoringTrigger.classList.add("placeholder-text");
      scoringOptionsContainer.innerHTML = "";

      selectedGroundId = "";
      groundText.textContent = "Select Ground";
      groundTrigger.classList.add("placeholder-text");
      groundOptionsContainer.innerHTML = "";

      document.querySelectorAll('.error-text').forEach(el => el.style.display = 'none');
      document.getElementById('generalError').style.display = 'none';
    }

    function goBack() { window.location.href = 'tournament.html'; } 

    async function loadScoringMatches() {
  try {
    scoringText.textContent = "Loading matches...";
    scoringTrigger.classList.add("placeholder-text");

    const allMatchesRes = await fetch(`${API_BASE_URL}/matches/all-linked`, {
      headers: { "Authorization": `Bearer ${localStorage.getItem("token")}` }
    });
    const allSystemMatches = await allMatchesRes.json();
    
    // Build a set of ALL used IDs across the entire application
    const usedScoringIds = new Set(
      allSystemMatches
        .filter(m => m.scoring_match_id)
        .map(m => String(m.scoring_match_id))
    );
    // const assocRes = await fetch(`${API_BASE_URL}/matches/tournament/${tournament.id}`, {
    //   headers: { "Authorization": `Bearer ${localStorage.getItem("token")}` }
    // });
    // const assocMatches = await assocRes.json();
    
    // // FIX 1: Explicitly convert to String to ensure types match
    // const usedScoringIds = new Set(
    //   assocMatches
    //     .filter(m => m.scoring_match_id)
    //     .map(m => String(m.scoring_match_id)) // Convert DB ID to String
    // );

    const res = await fetch(`${SCORING_API_BASE_URL}/api/v1/matches`, {
      headers: { "ngrok-skip-browser-warning": "true" }
    });
    
    if (!res.ok) throw new Error("Scoring API not reachable");
    
    const responseData = await res.json();
    const allScoringMatches = responseData.matches; 

    if (allScoringMatches && allScoringMatches.length > 0) {
      // FIX 2: Convert API ID to String during the filter check
      const availableMatches = allScoringMatches.filter(m => !usedScoringIds.has(String(m.matchId)));

      if (availableMatches.length === 0) {
        scoringText.textContent = "All live matches linked";
        scoringOptionsContainer.innerHTML = '<div class="custom-option-item" style="color:#6b7280; cursor:default;">All live matches are already linked</div>';
        return;
      }

      scoringText.textContent = "Select Scoring Match";
      let optionsHtml = '';
      
      availableMatches.forEach(m => {
        const dateStr = new Date(m.createdAt).toLocaleDateString();
        optionsHtml += `
          <div class="custom-option-item" 
               data-value="${m.matchId}" 
               data-home="${m.homeTeam}" 
               data-away="${m.awayTeam}"
               onclick="selectScoringMatchOption(this)">
             ${m.homeTeam} vs ${m.awayTeam} (${dateStr})
          </div>`;
      });
      scoringOptionsContainer.innerHTML = optionsHtml;
    } else {
      scoringText.textContent = "No matches found";
      scoringOptionsContainer.innerHTML = '<div class="custom-option-item" style="color:#6b7280; cursor:default;">No matches found in scoring app</div>';
    }
  } catch (err) {
    console.error("Scoring API Error:", err);
    scoringText.textContent = "Error fetching matches";
    scoringOptionsContainer.innerHTML = '<div class="custom-option-item" style="color:#e63946; cursor:default;">Error fetching matches</div>';
  }
}
    // Capture event selection values for custom select component lists layout updates cleanly
    function selectScoringMatchOption(element) {
        const val = element.getAttribute("data-value");
        const home = element.getAttribute("data-home");
        const away = element.getAttribute("data-away");

        selectedScoringMatchId = val;
        scoringText.textContent = element.textContent.trim();
        scoringTrigger.classList.remove("placeholder-text");
        
        // Populate reading input text fields mappings directly inside form layout
        document.getElementById("teamA").value = home;
        document.getElementById("teamB").value = away;

        // Visual selection indicator mapping adjustments looping configuration definitions arrays
        document.querySelectorAll("#scoringSelectOptions .custom-option-item").forEach(opt => {
            opt.classList.remove("selected-active");
        });
        element.classList.add("selected-active");
        scoringOptionsContainer.classList.remove("show-list");
        scoringChevron.classList.remove("rotate");
    }

    async function loadGroundsForTournament() {
      if (!tournament?.id) return;
      try {
          const res = await fetch(`${API_BASE_URL}/tournaments`, {
              headers: { "Authorization": `Bearer ${localStorage.getItem("token")}` }
          });
          const allTournaments = await res.json();
          const fresh = allTournaments.find(t => t.id === tournament.id);

          if (fresh?.grounds?.length > 0) {
              let groundsHtml = '';
              fresh.grounds.forEach(g => {
                  groundsHtml += `
                    <div class="custom-option-item" data-value="${g.id}" onclick="selectGroundOption(this)">
                        ${g.name}
                    </div>`;
              });
              groundOptionsContainer.innerHTML = groundsHtml;
          } else {
              groundOptionsContainer.innerHTML = '<div class="custom-option-item" style="color:#6b7280; cursor:default;">No grounds registered</div>';
          }
      } catch (err) { 
          console.error(err); 
          groundOptionsContainer.innerHTML = '<div class="custom-option-item" style="color:#e63946; cursor:default;">Error fetching grounds</div>';
      }
    }

    // Capture dynamic ground choice updates mapped down inside states values properties metrics
    function selectGroundOption(element) {
        selectedGroundId = element.getAttribute("data-value");
        groundText.textContent = element.textContent.trim();
        groundTrigger.classList.remove("placeholder-text");

        document.querySelectorAll("#groundSelectOptions .custom-option-item").forEach(opt => {
            opt.classList.remove("selected-active");
        });
        element.classList.add("selected-active");
        groundOptionsContainer.classList.remove("show-list");
        groundChevron.classList.remove("rotate");
    }

    async function loadMatches() {
      try {
        if (!tournament) return;
        document.getElementById('tournamentTitle').textContent = `Matches - ${tournament.name}`;

        const res = await fetch(`${API_BASE_URL}/matches/tournament/${tournament.id}`, {
          headers: { "Authorization": `Bearer ${localStorage.getItem("token") || ""}` }
        });
        const data = await res.json();
        currentMatches = data; // Save to global storage
        renderMatchList(data);
      } catch (e) { matchList.innerHTML = `<p class="empty">Error loading matches</p>`; }
    }

    function renderMatchList(data) {
        if (!data?.length) {
          matchList.innerHTML = `<p class="empty">No matches found.</p>`;
          return;
        }

        matchList.innerHTML = data.map(m => {
          const teams = (m.name || "").split(" vs ");
          const tA = teams[0] || "A"; const tB = teams[1] || "B";
          const matchString = encodeURIComponent(JSON.stringify(m));
          return `
            <div class="card" data-match="${matchString}" onclick="handleCardClick(this)">
              <span class='date'>Date: ${m.date ? new Date(m.date).toLocaleDateString() : "N/A"}</span>
              <div class='match-div'>
                <div style="text-align:center;">
                  <div style="width:40px; height:40px; border-radius:50%; background:#4B70C3; margin:auto; color:#fff; display:flex; align-items:center; justify-content:center;">${tA[0]}</div>
                  <span style="font-size:10px;">${tA}</span>
                </div>
                <span style="font-size:12px; font-weight:bold;">VS</span>
                <div style="text-align:center;">
                  <div style="width:40px; height:40px; border-radius:50%; background:#00CDFF; margin:auto; color:#fff; display:flex; align-items:center; justify-content:center;">${tB[0]}</div>
                  <span style="font-size:10px;">${tB}</span>
                </div>
              </div>
              <div style="font-size:10px; color:#83878D; text-align:center;">Venue: ${m.ground?.name || 'N/A'}</div>
              ${m.scoring_match_id ? '<div style="font-size:9px; color:#4B70C3; text-align:center; font-weight:bold;">✓ Linked to Scoring</div>' : ''}
            </div>`;
        }).join("");
    }

    document.getElementById("saveBtn").onclick = async () => {
    // 1. Reset Errors
    document.querySelectorAll('.error-text').forEach(el => el.style.display = 'none');
    document.querySelectorAll('.modal-input, .custom-select-trigger').forEach(el => el.classList.remove('invalid'));

    // 2. Values
    const teamA = document.getElementById("teamA").value.trim();
    const teamB = document.getElementById("teamB").value.trim();
    const mDate = document.getElementById("matchDate").value;
    const gId = selectedGroundId;
    const scoringId = selectedScoringMatchId;

    let isValid = true;

    // 3. Validation Logic
    if (!scoringId) {
        showError('scoring', 'scoringSelectTrigger');
        isValid = false;
    }
    if (!teamA) {
        showError('teamA', 'teamA');
        isValid = false;
    }
    if (!teamB) {
        showError('teamB', 'teamB');
        isValid = false;
    }
    if (!gId) {
        showError('ground', 'groundSelectTrigger');
        isValid = false;
    }
    if (!mDate) {
        showError('matchDate', 'matchDate');
        isValid = false;
    } else {
        // Tournament Date Range Check
        const start = new Date(tournament.startDate || tournament.start_date);
        const end = new Date(tournament.endDate || tournament.end_date);
        const selected = new Date(mDate);

        if (selected < start || selected > end) {
            const dateSpan = document.getElementById('error-matchDate');
            dateSpan.textContent = `Date must be between ${start.toLocaleDateString()} and ${end.toLocaleDateString()}`;
            showError('matchDate', 'matchDate');
            isValid = false;
        }
    }

    if (!isValid) return;

    // 4. Submit
    const payload = { 
        "name": `${teamA} vs ${teamB}`, 
        "date": mDate, 
        "tournament_id": tournament.id, 
        "ground_id": gId,
        "scoring_match_id": scoringId
    };

    try {
        const res = await fetch(`${API_BASE_URL}/matches`, {
            method: "POST",
            headers: { 
                "Content-Type": "application/json", 
                "Authorization": `Bearer ${localStorage.getItem("token")}` 
            },
            body: JSON.stringify(payload)
        });
        if (res.ok) { closeModal(); loadMatches(); }
        else { alert("Error creating match"); }
    } catch (err) { alert("Server Error"); }
};

// Helper function to show errors
function showError(errorId, elementId) {
    document.getElementById(`error-${errorId}`).style.display = 'block';
    document.getElementById(elementId).classList.add('invalid');
}

    function handleCardClick(element) {
      const matchData = JSON.parse(decodeURIComponent(element.getAttribute('data-match')));
      localStorage.setItem("selectedMatch", JSON.stringify(matchData));
      window.location.href = "dashboard.html";
    }

    window.addEventListener('DOMContentLoaded', () => {
      document.querySelector('.name').textContent = localStorage.getItem('name') || 'User';
      document.querySelector('.email').textContent = localStorage.getItem('email') || '';
      loadMatches();
    });
  </script>
</body>
</html>
