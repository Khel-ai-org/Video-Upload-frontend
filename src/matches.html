<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Matches</title>

<style>
* { box-sizing: border-box; }

body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  background: #f5f7fa;
  margin: 0;
  padding: 20px;
  color: #1f2937;
}

/* TOP BAR */
.top-bar {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 60px;
  background: #ffffff;
  z-index: 1200;
  display: flex;
  align-items: center;
  border-bottom: 1px solid #e5e7eb;
}

.back-btn {
  height: 100%;
  padding: 0 20px;
  border: none;
  color: #111827;
  background: transparent;
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
}

.back-btn:hover {
  background: #f3f4f6;
}

.arrow {
  width: 9px;
  height: 9px;
  border-left: 2px solid #111;
  border-bottom: 2px solid #111;
  transform: rotate(45deg);
}

/* HEADER */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 60px;
  margin-bottom: 10px;
}

.header h1 {
  margin: 0;
  font-size: 24px;
  font-weight: 600;
}

/* BUTTON */
button {
  padding: 9px 14px;
  border: none;
  border-radius: 6px;
  background: #2563eb;
  color: white;
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
}

button:hover {
  background: #1d4ed8;
}

/* MATCH GRID */
.match-list {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}

/* CARD */
.card {
  background: #ffffff;
  padding: 16px;
  border-radius: 8px;
  border: 1px solid #e5e7eb;
}

.card h3 {
  margin: 0 0 6px;
  font-size: 16px;
  font-weight: 600;
}

.card p {
  margin: 3px 0;
  font-size: 13px;
  color: #4b5563;
}

.vs {
  font-weight: 600;
  color: #2563eb;
}

/* EMPTY */
.empty {
  color: #6b7280;
  font-size: 14px;
}

/* MODAL */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  display: none;
  align-items: center;
  justify-content: center;
}

.modal {
  background: #ffffff;
  padding: 20px;
  border-radius: 8px;
  width: 420px;
  max-width: 92%;
}

.modal h2 {
  margin: 0 0 14px;
  font-size: 18px;
  font-weight: 600;
}

.modal input,
.modal select {
  width: 100%;
  padding: 9px 10px;
  margin-bottom: 10px;
  border: 1px solid #d1d5db;
  border-radius: 6px;
  font-size: 14px;
  background: white;
}

.modal input:focus,
.modal select:focus {
  outline: none;
  border-color: #2563eb;
}

/* MODAL ACTIONS */
.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
}

.cancel-btn {
  background: #9ca3af;
}

.cancel-btn:hover {
  background: #6b7280;
}
</style>

</head>
<body>
    <div class="top-bar">
  <button id="backBtn" class="back-btn" onclick="goBack()">
    <span class="arrow"></span>
  Back
  </button>
</div>
  <div class="header">
    <h1>Matches</h1>
    <button id="createBtn">+ Create Match</button>
  </div>

  <div id="matchList" class="match-list"></div>

  <!-- CREATE MATCH MODAL -->
  <div id="modalOverlay" class="modal-overlay">
    <div class="modal">
      <h2>Create Match</h2>

      <input id="teamA" placeholder="Team A" />
      <input id="teamB" placeholder="Team B" />
     
      <input id="matchDate" type="date" />
       <select id="innings" required>
  <option value="" disabled selected>Select Inning</option>
  <option value="First">First</option>
  <option value="Second">Second</option>
</select>

      <div class="modal-actions">
        <button class="cancel-btn" id="cancelBtn">Cancel</button>
        <button id="saveBtn">Save</button>
      </div>
    </div>
  </div>

  <script src="config.js"></script>

  <script>
    const matchList = document.getElementById("matchList");
    const modal = document.getElementById("modalOverlay");

    document.getElementById("createBtn").onclick = () => modal.style.display = "flex";
    document.getElementById("cancelBtn").onclick = closeModal;

    modal.onclick = e => {
      if (e.target === modal) closeModal();
    };

    function closeModal() {
      modal.style.display = "none";
      ["teamA","teamB","matchDate" , "innings"]
        .forEach(id => document.getElementById(id).value = "");
    }

    function openMatch(match) {
  localStorage.setItem("selectedMatch", JSON.stringify(match));
  window.location.href = "dashboard.html";  // or your desired details page
}
function goBack() {
  window.location.href = 'tournament.html';
} 

    async function loadMatches() {
      try {
        const detail =  JSON.parse(localStorage.getItem("selectedTournament"));
        console.log(detail);
        console.log(localStorage.getItem("token"));
        const res = await fetch(`${API_BASE_URL}/matches/tournament/${detail.id}`, {
          headers: {
            "Authorization": `Bearer ${localStorage.getItem("token") || ""}`
          }
        });

        const data = await res.json();

        if (!data.length) {
          matchList.innerHTML = `<p class="empty">No matches available.</p>`;
          return;
        }

        matchList.innerHTML = data.map(m => `
          <div class="card" onclick='openMatch(${JSON.stringify(m)})'>
            <h3>
              ${m.name}
            </h3>
            <p><b>Date:</b> ${m.date || "N/A"}</p>
           
          </div>
        `).join("");

      } catch {
        matchList.innerHTML = `<p class="empty">Failed to load matches</p>`;
      }
    }

    document.getElementById("saveBtn").onclick = async () => {
      const payload = {
        teamA: teamA.value,
        teamB: teamB.value,
        
        matchDate: matchDate.value,
       innings:innings.value
      };

    

      await fetch(`${API_BASE_URL}/matches`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${localStorage.getItem("token") || ""}`
        },
        body: JSON.stringify({
            "name": `${teamA.value} vs ${teamB.value}`,
            "inings": innings.value === 'First' ? '1' : innings.value === 'Second' ? '2' : null ,
            "date" : matchDate.value,
            "tournament_id": JSON.parse(localStorage.getItem("selectedTournament")).id

        })
      });

      closeModal();
      loadMatches();
    };

    loadMatches();
  </script>

</body>
</html>
