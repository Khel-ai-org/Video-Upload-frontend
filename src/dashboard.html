   function formatTime(isoTime) {
  const date = new Date(isoTime);

  return date.toLocaleString("en-IN", {
    day: "2-digit",
    month: "short",
    year: "numeric",
    hour: "2-digit",
    minute: "2-digit",
    hour12: true
  });
}

   function formatSize(bytes) {
  if (!bytes || bytes == 0) return "0 MB";

  const k = 1024;
  const sizes = ["B", "KB", "MB", "GB", "TB"];
  const i = Math.floor(Math.log(bytes) / Math.log(k));

  return `${(bytes / Math.pow(k, i)).toFixed(2)} ${sizes[i]}`;
}

const wrapper = document.getElementById("video-wrapper");

let isDragging = false;
let offsetX = 0;
let offsetY = 0;

wrapper.addEventListener("mousedown", (e) => {
  isDragging = true;
  offsetX = e.clientX - wrapper.offsetLeft;
  offsetY = e.clientY - wrapper.offsetTop;
});

document.addEventListener("mousemove", (e) => {
  if (!isDragging) return;

  wrapper.style.left = `${e.clientX - offsetX}px`;
  wrapper.style.top = `${e.clientY - offsetY}px`;
  wrapper.style.transform = "none"; // important
});

document.addEventListener("mouseup", () => {
  isDragging = false;
});

const closeBtn = document.getElementById("closeVideoBtn");

closeBtn.addEventListener("click", () => {
  const video = document.getElementById("videoPlayer");

  video.src = ""; // clear src to stop loading/playing
});

function renderSessions(data) {
  const grid = document.getElementById("session-grid");
  const sess = document.getElementById("fileList");
  sess.innerHTML="";
  grid.innerHTML = ""; // clear old
  // console.log(data);

  data?.forEach(session => {
    const card = document.createElement("div");
    card.className = "card session-card";
      card.onclick = () => onSessionClick(session);
    card.innerHTML = `
      <div class="session-time">${formatTime(session.createdAt)}</div>
      <div class="session-size">${formatSize(session.totalSize)}</div>
    `;

    grid.appendChild(card);

  });
}

   function buildTree(apiData) {
  const root = { name: "root", type: "folder", children: [] };

  for (const [path, files] of Object.entries(apiData.folders)) {
    const parts = path === "root" ? [] : path.split("/");
    let current = root;

    // build folder hierarchy
    for (const part of parts) {
      let folder = current.children.find(
        c => c.type === "folder" && c.name === part
      );

      if (!folder) {
        folder = { name: part, type: "folder", children: [] };
        current.children.push(folder);
      }
      current = folder;
    }

    // add files
    for (const f of files) {
      if (f.file === ".DS_Store") continue;

      current.children.push({
        name: f.file,
        type: "file",
        size: f.size,
        status: f.status,
        s3Key: f.s3Key
      });
    }
  }
  console.log(root);
  return root;
}

  document.getElementById("path").textContent =
    folder === fileTree
      ? "root"
      : ["root", ...history.map(f => f.name), folder.name].join(" / ");

  // folders first

function getStatusColor(status) {
  switch (status) {
    case "completed":
      return "green";
    case "uploading":
      return "orange";
      case "failed":
        return "red";
    case "orphaned":
      return "red";
    case "missing":
      return "darkred";
    case "pending":
      return "blue";
    default:
      return "gray";
  }
}

    function sortByCreatedAt(items, order = "asc") {
  return [...items].sort((a, b) => {
    const timeA = new Date(a.createdAt).getTime();
    const timeB = new Date(b.createdAt).getTime();

    return order === "asc" ? timeA - timeB : timeB - timeA;
  });
}
