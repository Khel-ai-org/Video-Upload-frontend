<!DOCTYPE html>
<html lang="en">
<head>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#F8FAFC] min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-3xl p-8 w-full max-w-[400px] shadow-lg text-center">
    <img src="assets/Logo.png" class="w-16 h-16 mx-auto mb-4" />
    <h2 class="text-2xl font-bold mb-2">Enter your registered email address to receive a verification OTP.</h2>
    
    <div class="text-left mt-6">
      <label class="block text-md font-semibold text-gray-800 mb-2">Email</label>
      <input type="email" id="email" placeholder="Enter Your Email Address" class="w-full bg-[#F3F4F6] rounded-xl p-3 mb-6 outline-none" />
    </div>

    <button id="continueBtn" class="w-full bg-[#4F75C9] text-white py-3 rounded-2xl font-bold">Continue</button>
    <p class="mt-4 text-sm">Don’t Have an account? <a href="index.html" class="text-[#4F75C9] font-bold">Register</a></p>
  </div>

  <script src="config.js"></script>
  <script>
    document.getElementById('continueBtn').addEventListener('click', async () => {
      const email = document.getElementById('email').value;
      const res = await fetch(`${API_BASE_URL}/auth/forgot-password`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      });
      if (res.ok) {
        localStorage.setItem("resetEmail", email);
        window.location.href = "verify-reset.html";
      } else alert("Error sending OTP");
    });
  </script>
</body>
</html>
