
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Verify Email</title>
</head>
<body class="bg-[#F8FAFC] min-h-screen flex items-center justify-center p-4">
  
  <div class="bg-white rounded-3xl p-8 w-full max-w-[400px] shadow-lg text-center">
    <!-- Single Header Section -->
    <div class="mb-8">
      <img src="assets/Logo.png" class="w-16 h-16 mx-auto mb-4" />
      <h1 class="text-2xl font-bold">Verification Code</h1>
      <p class="text-gray-500 text-sm mt-2">Enter the 6-digit code sent to <br><span id="displayEmail" class="font-bold text-gray-800"></span></p>
    </div>
    
    <!-- OTP Inputs -->
    <div class="flex justify-between gap-2 mb-6" id="otp-inputs">
      <input type="text" maxlength="1" class="otp-digit w-12 h-14 border-2 rounded-xl text-center text-xl font-bold focus:border-[#4F75C9] outline-none transition-all">
      <input type="text" maxlength="1" class="otp-digit w-12 h-14 border-2 rounded-xl text-center text-xl font-bold focus:border-[#4F75C9] outline-none transition-all">
      <input type="text" maxlength="1" class="otp-digit w-12 h-14 border-2 rounded-xl text-center text-xl font-bold focus:border-[#4F75C9] outline-none transition-all">
      <input type="text" maxlength="1" class="otp-digit w-12 h-14 border-2 rounded-xl text-center text-xl font-bold focus:border-[#4F75C9] outline-none transition-all">
      <input type="text" maxlength="1" class="otp-digit w-12 h-14 border-2 rounded-xl text-center text-xl font-bold focus:border-[#4F75C9] outline-none transition-all">
      <input type="text" maxlength="1" class="otp-digit w-12 h-14 border-2 rounded-xl text-center text-xl font-bold focus:border-[#4F75C9] outline-none transition-all">
    </div>

    <!-- Timer and Resend -->
    <div class="flex justify-between text-sm mb-6 font-medium">
      <span id="timer" class="text-gray-600">02:00</span>
      <button id="resendBtn" class="text-[#4F75C9] hover:underline hidden">Resend Code</button>
    </div>

    <!-- Actions -->
    <button id="verifyBtn" disabled class="w-full bg-[#4F75C9] text-white py-3 rounded-2xl font-bold mb-3 disabled:opacity-30 transition-all">Verify</button>
    <button onclick="window.history.back()" class="w-full border border-gray-300 py-3 rounded-2xl font-bold text-gray-700 hover:bg-gray-50 transition-all">Go back</button>
  </div>

  <script src="config.js"></script>
  <script>
    const email = localStorage.getItem("pendingEmail") || "user@example.com";
    document.getElementById("displayEmail").textContent = email;
    
    const inputs = document.querySelectorAll(".otp-digit");
    const verifyBtn = document.getElementById("verifyBtn");
    const timerDisplay = document.getElementById("timer");
    const resendBtn = document.getElementById("resendBtn");
    
    let timeLeft = 120; // 2 minutes
    let timerInterval;

    // --- TIMER LOGIC ---
    function startTimer() {
      timeLeft = 120;
      resendBtn.classList.add("hidden");
      verifyBtn.disabled = false;
      
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timeLeft--;
        const mins = Math.floor(timeLeft / 60);
        const secs = timeLeft % 60;
        timerDisplay.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          verifyBtn.disabled = true; // Disable verify when time stops
          resendBtn.classList.remove("hidden");
        }
      }, 1000);
    }

    // --- INPUT LOGIC ---
    inputs.forEach((input, index) => {
      // Allow only numbers
      input.addEventListener("input", (e) => {
        e.target.value = e.target.value.replace(/[^0-9]/g, '');
        if (e.target.value.length === 1 && index < 5) inputs[index + 1].focus();
        validateForm();
      });

      // Handle Backspace
      input.addEventListener("keydown", (e) => {
        if (e.key === "Backspace" && !e.target.value && index > 0) {
          inputs[index - 1].focus();
        }
      });
    });

    function validateForm() {
      const allFilled = Array.from(inputs).every(input => input.value.length === 1);
      const isTimerRunning = timeLeft > 0;
      verifyBtn.disabled = !(allFilled && isTimerRunning);
    }

    // --- API CALLS ---
    verifyBtn.addEventListener("click", async () => {
      const otp = Array.from(inputs).map(i => i.value).join("");
      try {
        const res = await fetch(`${API_BASE_URL}/auth/verify-otp`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, otp })
        });
        if (res.ok) {
          alert("Verified successfully!");
          window.location.href = "index.html";
        } else {
          alert("Invalid code. Please try again.");
        }
      } catch (err) {
        alert("Server error, please try again.");
      }
    });

    resendBtn.addEventListener("click", async () => {
      try {
        await fetch(`${API_BASE_URL}/auth/resend-otp`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email })
        });
        alert("Code resent successfully!");
        startTimer(); // Reset timer
      } catch (err) {
        alert("Could not resend code.");
      }
    });

    // Start on load
    startTimer();
  </script>
</body>
</html>
