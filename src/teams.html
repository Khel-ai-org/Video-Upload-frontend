<!DOCTYPE html>

<head>

  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Plus Jakarta Sans", sans-serif; background: #ffffff; }

    /* Top Bar */
    .top-bar { display: flex; width: 100%; background: #ffffff; padding: 20px 40px; align-items: center; justify-content: space-between; border-bottom: 1px solid #E5F0FF; }
    .left-section { display: flex; align-items: center; gap: 20px; }
    .back-btn { width: 36px; height: 36px; cursor: pointer; }
    .logo-box { display: flex; align-items: center; gap: 10px; }
    .search-container { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-radius: 12px; border: 1px solid #E5F0FF; background: #FFF; width: 400px; }
    .search-input { border: none; outline: none; flex: 1; font-size: 14px; }
    .user-profile { display: flex; align-items: center; gap: 12px; cursor: pointer; }
    .user-profile img { width: 40px; height: 40px; border-radius: 50%; }
    .name { color: #1F2022; font-size: 14px; font-weight: 600; }

    /* Modal Styling */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 1000; }
    
    .modal-close { position: absolute; top: 15px; right: 15px; background: none; border: none; font-size: 20px; cursor: pointer; color: #83878D; }
    
    .modal-btn { width: 100%; padding: 14px; border: 1px solid #E5F0FF; border-radius: 10px; background: #f9f9f9; margin-bottom: 10px; cursor: pointer; font-weight: 600; color: #6b7280; text-align: left; }
    
    /* Modal Styling Improvements */
.modal { 
    background: #fff; 
    padding: 0; /* Remove padding here so body/footer can control it */
    border-radius: 20px; 
    width: 450px; 
    height: 85vh; /* Fixed height */
    position: relative; 
    display: flex; 
    flex-direction: column; /* Stack header, body, footer */
}

.modal-header { padding: 30px 30px 10px 30px; text-align: center; }

.modal-body { 
    flex: 1; /* Take up all available space */
    overflow-y: auto; /* Scroll ONLY this part */
    padding: 0 30px 30px 30px; 
}

.modal-footer { 
    padding: 20px; 
    border-top: 1px solid #E5F0FF; 
    background: #fff; 
    border-bottom-left-radius: 20px; 
    border-bottom-right-radius: 20px; 
}
    /* Dropdown UI */
    .dropdown-trigger { display: flex; justify-content: space-between; align-items: center; }
    .scrollable-section { max-height: 200px; overflow-y: auto; border: 1px solid #E5F0FF; border-radius: 10px; padding: 10px; margin-top: 5px; background: #fdfdfd; display: none; }
    .team-checkbox-item { padding: 10px; border-bottom: 1px solid #ececec; display: flex; align-items: center; gap: 10px; }

    /* Manual Add */
    .team-input-row { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
    .team-input { flex: 1; padding: 10px; border: 1px solid #E5F0FF; border-radius: 8px; }
    .icon-btn { padding: 8px 12px; border-radius: 8px; border: none; cursor: pointer; color: white; font-weight: bold; }
    .btn-add { background: #28a745; }
    .btn-remove { background: #dc3545; }
    
    .done-btn { width: 100%; padding: 15px; background: #4B70C3; color:white; border:none; border-radius: 10px; cursor:pointer; font-weight: 600; margin-top: 20px; }

    /* Main Content */
    .main-container { padding: 0 40px; }
    .breadcrumb { padding: 20px 40px; display: flex; align-items: center; gap: 10px; color: #83878D; font-size: 14px; cursor: pointer; }
    .toggle-container { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; }
    .toggle-btn { padding: 10px 30px; border-radius: 8px; border: 1px solid #E5F0FF; background: #fff; font-weight: 600; cursor: pointer; }
    .toggle-btn.active { background: #4B70C3; color: white; border: none; }
    .teams-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .add-teams-btn { background: #4B70C3; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; }
    .team-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
    .team-card { border: 1px solid #E5F0FF; padding: 20px; border-radius: 12px; text-align: center; }
    .team-logo { width: 60px; height: 60px; border-radius: 50%; margin-bottom: 10px; object-fit: cover; }
    .footer-action { text-align: center; margin: 40px 0; }
    .generate-btn { background: #4B70C3; color: white; padding: 15px 100px; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; }

    .fixture-modal { background: #fff; padding: 30px; border-radius: 20px; width: 600px; max-height: 90vh; overflow-y: auto; position: relative; }
    .row { display: flex; gap: 20px; margin-bottom: 20px; }
    .col { flex: 1; }
    .form-group { margin-bottom: 15px; }
    .label { font-weight: 600; font-size: 14px; margin-bottom: 8px; display: block; }
    .input-field { width: 100%; padding: 10px; border: 1px solid #E5F0FF; border-radius: 8px; }
    .group-bucket { border: 1px solid #E5F0FF; padding: 15px; border-radius: 12px; margin-bottom: 10px; background: #fdfdfd; }
    .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }

    /* Add these styles */
.pill-container { display: flex; flex-wrap: wrap; gap: 8px; padding: 5px; }
.pill { 
    background-color: #f0f4f8; 
    padding: 6px 12px; 
    border-radius: 6px; 
    display: flex; 
    align-items: center; 
    gap: 8px; 
    font-size: 13px; 
    border: 1px solid #e1e8ed;
}
.pill-remove { 
    cursor: pointer; 
    font-weight: bold; 
    color: #83878D; 
    font-size: 14px;
}
.pill-remove:hover { color: #dc3545; }

.team-avatar {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: #46dae5; /* Change to any color you prefer */
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 700;
    margin: 8px auto;
    text-transform: uppercase;
}
#teamInputContainer {
    /* Limits the height so it only shows ~3-4 items at once */
    max-height: 200px; 
    
    /* Adds a minimum height so it doesn't look collapsed if empty */
    min-height: 60px; 
    
    /* Enables scrolling when content exceeds the max-height */
    overflow-y: auto; 
    
    /* Styling to make it look like a distinct input area */
    border: 1px solid #E5F0FF; 
    padding: 10px;
    border-radius: 8px;
    background: #fdfdfd;
    margin-top: 10px;
}

/* Optional: Make the scrollbar look elegant on Mac */
#teamInputContainer::-webkit-scrollbar {
    width: 8px;
}
#teamInputContainer::-webkit-scrollbar-thumb {
    background-color: #d1d5db;
    border-radius: 4px;
}
  </style>

<script>

    
    let currentTournamentId = "";
    let allTournamentTeams = [];

    function openModal() {
        document.getElementById('addTeamModal').style.display = 'flex';
        fetchAvailableTeams();
    }

    function toggleModal(show) { document.getElementById('addTeamModal').style.display = show ? 'flex' : 'none'; }
    
    function showSection(id) {
        document.getElementById('manualSection').style.display = id === 'manualSection' ? 'block' : 'none';
    }

    function toggleDropdown() {
        const list = document.getElementById('dropdownList');
        list.style.display = list.style.display === 'block' ? 'none' : 'block';
    }

    function toggleSection(id) {
    const sec = document.getElementById(id);
    const isOpening = sec.style.display === 'none';
    
    // Toggle the display
    sec.style.display = isOpening ? 'block' : 'none';
    
    // If we just opened the manual section AND it's empty, add the first row automatically
    if (isOpening) {
        const container = document.getElementById('teamInputContainer');
        if (container.children.length === 0) {
            addInputRow();
        }
    }
}

function handleFileUpload(event) {
    const file = event.target.files[0];
    if (!file) return;

    // 1. Show the file name
    document.getElementById('fileSelectedName').textContent = "Selected: " + file.name;
    
    // 2. FORCE the manual section to open
    document.getElementById('manualSection').style.display = 'block';

    const reader = new FileReader();
    reader.onload = function(e) {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        
        const firstSheetName = workbook.SheetNames[0];
        const worksheet = workbook.Sheets[firstSheetName];
        const json = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

        // Optional: Clear existing rows before importing new ones 
        // so you don't get duplicates if you import twice
        document.getElementById('teamInputContainer').innerHTML = '';
        
        json.forEach((row, index) => {
            // Skip header (index 0) AND skip empty/undefined rows
            if (index === 0 || !row[0] || row[0].toString().trim() === "") return; 
            
            // FIX: Call addInputRow here, not addNewRow
            addInputRow(row[0]); 
        });
    };
    reader.readAsArrayBuffer(file);
}

// Keep this helper exactly as you have it
function addInputRow(teamName = "") {
    const container = document.getElementById('teamInputContainer');
    const div = document.createElement('div');
    div.className = 'team-input-row';
    div.innerHTML = `
        <input type="text" class="team-input" value="${teamName}" placeholder="Team Name">
        <button class="icon-btn btn-add" style="background: #28a745;" onclick="addInputRow()">+</button>
        <button class="icon-btn btn-remove" style="background: #dc3545;" onclick="this.parentElement.remove()">-</button>
    `;
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
}
    async function fetchAvailableTeams() {
        const container = document.getElementById('teamSelectionList');
        try {
            const res = await fetch(`${SCORING_API_BASE_URL}/api/v1/teams/all-names`, {
      headers: { "ngrok-skip-browser-warning": "true" }
    });
            const data = await res.json();
            const teams = data.teams || [];
            console.log("Teams,data",data);
            
            container.innerHTML = teams.map(t => `
                <div class="team-checkbox-item">
                    <input type="checkbox" value="${t.id}">
                    <label>${t.name}</label>
                </div>
            `).join('');
        } catch (e) {
            container.innerHTML = "<p>Error loading global teams.</p>";
        }
    }

    async function submitTeams() {
        const freshData = localStorage.getItem("selectedTournament");
    if (!freshData) return alert("Error: No tournament selected!");
    
    const freshTournament = JSON.parse(freshData);
    const tournamentId = freshTournament.externalTournamentId; 
    
    console.log("Submitting for Tournament ID:", tournamentId);
    const payload = [];
    
    // 1. Get Checked Teams
    const checked = document.querySelectorAll('#teamSelectionList input:checked');
    checked.forEach(cb => payload.push({ team_id: cb.value }));

    // 2. Get Manual Teams
    const manualInputs = document.querySelectorAll('.team-input');
    manualInputs.forEach(input => { 
        if (input.value.trim()) {
            // Added short_name as optional, derived from name or empty
            payload.push({ 
                name: input.value.trim(),
                short_name: input.value.trim().substring(0, 3).toUpperCase() // Optional: auto-generate short name
            }); 
        }
    });

    if (payload.length === 0) return alert("Please add or select teams");
    
    console.log("Sending Payload:", payload);

    try {
        const res = await fetch(`${SCORING_API_BASE_URL}/api/v1/tournaments/${tournamentId}/teams/bulk`, {
            method: 'POST',
            headers: { 
                "Content-Type": "application/json",
                
                "ngrok-skip-browser-warning": "true" 
            },
            body: JSON.stringify(payload)
        });

        if (res.ok) {
            alert("Teams added!");
            toggleModal(false);
            loadTeams(currentTournamentId);
        } else {
            // Log the actual server error message for 400 Bad Request
            const errorData = await res.json();
            console.error("Server Error:", errorData);
            alert("Failed: " + (errorData.error || "Bad Request"));
        }
    } catch (e) { 
        console.error("Fetch Error:", e);
        alert("Failed to add teams."); 
    }
}
    // Load Initial Data
    const storedData = localStorage.getItem("selectedTournament");
    if (storedData) {
        const tournament = JSON.parse(storedData);
        currentTournamentId = tournament.externalTournamentId;
        document.getElementById("tournamentNameTitle").textContent = `Teams of ${tournament.name}`;
        loadTeams(tournament.externalTournamentId);
    }

    async function loadTeams(tournamentId) {
        // Move grid outside the try block so it is accessible everywhere
        const grid = document.getElementById("teamGrid");
        
        try {
            const res = await fetch(`${SCORING_API_BASE_URL}/api/v1/tournaments/${tournamentId}/teams`, {
               headers: { "ngrok-skip-browser-warning": "true" }
            });
            
            if (!res.ok) throw new Error("Failed to fetch");

            const teams = await res.json();
            
            if (!teams || teams.length === 0) { 
                grid.innerHTML = "<p>No teams added yet.</p>"; 
                return; 
            }
            
            grid.innerHTML = teams.map(team => `
                <div class="team-card">
    <div style="font-size:11px; color:#83878D;">
        Team ID - ${team.id ? team.id.slice(-6) : 'N/A'}
    </div>

    <div class="team-avatar">
        ${(team.short_name || team.name || "T").charAt(0).toUpperCase()}
    </div>

    <div style="font-weight:600; font-size:14px;">
        ${team.name}
    </div>

    <div style="font-size:12px; color:#83878D;">
        ${team.short_name || ""}
    </div>
</div>
            `).join("");
            
        } catch (e) { 
            // Now 'grid' is accessible here
            console.error(e);
            grid.innerHTML = "<p>Error loading teams.</p>"; 
        }
    }

    document.querySelector('.generate-btn').onclick = function() {
        const isGroup = document.querySelector('.toggle-btn.active').textContent.includes('Group');
        toggleFixtureModal(true, isGroup);
        fetchFixtureTeams();
    };

    function toggleFixtureModal(show, isGroup) {
    const modal = document.getElementById('fixtureModal');
    const title = document.getElementById('fixtureModalTitle');
    const groupContainer = document.getElementById('groupCountContainer');
    const bucketContainer = document.getElementById('groupBucketsContainer');

    if (!modal) {
        console.error("Modal element 'fixtureModal' not found!");
        return;
    }

    modal.style.display = show ? 'flex' : 'none';

    // Only update elements if they exist (prevents the crash)
    if (groupContainer) {
        groupContainer.style.display = isGroup ? 'block' : 'none';
    }
    
    if (bucketContainer) {
        bucketContainer.style.display = isGroup ? 'block' : 'none';
    }

    if (title) {
        title.textContent = isGroup ? "Generate Group Fixtures" : "Generate League Fixtures";
    } else {
        console.warn("Element 'fixtureModalTitle' not found.");
    }
}

function updatePills(containerId, pillContainerId) {
    const container = document.getElementById(containerId);
    const pillContainer = document.getElementById(pillContainerId);
    pillContainer.innerHTML = ''; // Clear existing

    const checkedInputs = container.querySelectorAll('input[type="checkbox"]:checked');
    
    checkedInputs.forEach(cb => {
        const teamName = cb.getAttribute('data-name');
        const teamId = cb.value;
        
        const pill = document.createElement('div');
        pill.className = 'pill';
        pill.innerHTML = `
            ${teamName} 
            <span class="pill-remove" onclick="removePill('${teamId}', '${containerId}', '${pillContainerId}')">✕</span>
        `;
        pillContainer.appendChild(pill);
    });
}

// 2. Remove pill functionality
function removePill(teamId, containerId, pillContainerId) {
    const container = document.getElementById(containerId);
    const checkbox = container.querySelector(`input[value="${teamId}"]`);
    if (checkbox) {
        checkbox.checked = false;
        updatePills(containerId, pillContainerId);
    }
}

    async function fetchFixtureTeams() {
    const container = document.getElementById('fixtureTeamSelectionList');
    console.log("Fetching fixture teams for ID:", currentTournamentId);
    
    // Check if ID is missing
    if (!currentTournamentId) {
        container.innerHTML = "<p>Error: Tournament ID missing.</p>";
        return;
    }

    try {
        // FIX: Use SCORING_API_BASE_URL (same as your working loadTeams function)
        const url = `${SCORING_API_BASE_URL}/api/v1/tournaments/${currentTournamentId}/teams`;
        console.log("Fixture Fetch URL:", url);

        const res = await fetch(url, {
            headers: { 
                "Authorization": `Bearer ${localStorage.getItem("token")}`,
                "ngrok-skip-browser-warning": "true" 
            }
        });
        
        if (!res.ok) throw new Error(`HTTP Error: ${res.status}`);
        
        const teams = await res.json();
        console.log("Fixture Teams Data:", teams);
        allTournamentTeams = teams;
        
        // Update the Total Teams input field automatically
        document.getElementById('totalTeams').value = teams.length;

        container.innerHTML = teams.map(t => `
            <div class="team-checkbox-item">
                <!-- IMPORTANT: Add onchange listener here -->
                <input type="checkbox" value="${t.id}" data-name="${t.name}" 
                       onchange="updatePills('fixtureTeamSelectionList', 'mainPills')">
                <label>${t.name}</label>
            </div>
        `).join('');

    } catch (e) {
        console.error("Fixture Fetch Error:", e);
        container.innerHTML = `<p>Error loading teams: ${e.message}</p>`;
    }
}

    // This function checks which button is currently active
    function getSelectedTournamentType() {
        const activeBtn = document.querySelector('.toggle-btn.active');
        return activeBtn.textContent.includes('Group') ? 'Group' : 'League';
    }

    async function submitFixtures() {
    // 1. Get Tournament Details from LocalStorage
    const storedData = localStorage.getItem("selectedTournament");
    if (!storedData) return alert("Tournament data missing!");
    const tournament = JSON.parse(storedData);
    
    // 2. Prepare Payload
    const isGroup = document.querySelector('.toggle-btn.active').textContent.includes('Group');
    
    const payload = {
        team_ids: Array.from(document.querySelectorAll('#fixtureTeamSelectionList input:checked')).map(cb => cb.value),
        group_configuration: isGroup ? getGroupConfiguration() : null,
        start_date: tournament.startDate || new Date().toISOString(), // Fallback to current date if missing
        venues: null,
        no_of_teams_qualify_playoffs: parseInt(document.getElementById('playoffTeams').value)
    };

    console.log("Submitting Fixtures Payload:", payload);

    // 3. API Call
    try {
        const res = await fetch(`${SCORING_API_BASE_URL}/api/v1/tournaments/${currentTournamentId}/fixtures`, {
            method: 'POST',
            headers: { 
                "Content-Type": "application/json",
                "Authorization": `Bearer ${localStorage.getItem("token")}`,
                "ngrok-skip-browser-warning": "true" 
            },
            body: JSON.stringify(payload)
        });

        if (res.ok) {
            alert("Fixtures generated successfully!");
            toggleFixtureModal(false);
            window.location.reload(); // Or redirect to matches page
        } else {
            const err = await res.json();
            console.error("API Error:", err);
            alert("Failed to generate fixtures: " + (err.message || "Unknown error"));
        }
    } catch (e) {
        console.error("Fetch Error:", e);
        alert("Server error. Please try again.");
    }
}

// Helper to build the group_configuration object from the DOM
function getGroupConfiguration() {
    const config = {};
    const buckets = document.querySelectorAll('.group-bucket');
    
    buckets.forEach(bucket => {
        const groupName = bucket.querySelector('.label').textContent; // e.g., "Group A"
        // Find all checked boxes inside this specific bucket
        const checked = bucket.querySelectorAll('input[type="checkbox"]:checked');
        config[groupName] = Array.from(checked).map(c => c.value);
    });
    
    return config;
}

        document.getElementById('userHeaderEmail').textContent = localStorage.getItem('email') || '';

    });
